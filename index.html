  노션 임베드용 뮤직 플레이어 위젯 (단일 파일)
  - Google 로그인(Google Identity Services) + YouTube Data API v3 로 재생목록 조회/생성/편집
  - 재생은 YouTube IFrame Player (YouTube Music 에서 쓰는 영상 ID 와 동일)
  - 설정 방법은 위젯 우측 상단 ⚙ 버튼 또는 README 참고

  // 외부 스크립트가 먼저 로드돼도 안전하도록 콜백을 미리 정의
  window.__gsi = function () { window.initAuth && window.initAuth(); };
  window.onYouTubeIframeAPIReady = function () { window.createPlayer && window.createPlayer(); };

<style>
:root{
  --c1:#ff6fb5; --c2:#7a6bff; --c3:#8ff0d0; --ink:#2a2750; --paper:#ffffff; --onc1:#2a2750;
  --c1l:color-mix(in srgb,var(--c1) 55%,#fff);
  --c1xl:color-mix(in srgb,var(--c1) 24%,var(--paper));
  --c2l:color-mix(in srgb,var(--c2) 60%,#fff);
  --c2m:color-mix(in srgb,var(--c2) 38%,var(--paper));
  --c2d:color-mix(in srgb,var(--c2) 50%,var(--paper));
  --c2xl:color-mix(in srgb,var(--c2) 14%,var(--paper));
  --c3xl:color-mix(in srgb,var(--c3) 24%,var(--paper));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  font-size:13px; color:var(--ink); padding:8px; overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 10%,var(--paper)) 0%,color-mix(in srgb,var(--c2) 12%,var(--paper)) 45%,color-mix(in srgb,var(--c3) 14%,var(--paper)) 100%);
  display:flex; justify-content:center;
}
button{font:inherit;color:inherit}
.shell{
  width:100%; max-width:460px; height:100%; min-height:440px; display:flex; flex-direction:column; overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 92%,transparent),color-mix(in srgb,var(--paper) 62%,transparent));
  border:2px solid var(--ink); border-radius:14px; box-shadow:5px 5px 0 color-mix(in srgb,var(--c2) 35%,transparent);
}
/* 타이틀바 */
.titlebar{
  display:flex; align-items:center; gap:8px; padding:6px 10px; color:#fff; flex:none;
  background:linear-gradient(90deg,var(--c1l),var(--c2l) 55%,var(--c3));
  border-bottom:2px solid var(--ink);
  font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:.08em; text-shadow:0 1px 0 rgba(0,0,0,.25);
}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;display:block}
.ttl{white-space:nowrap}
.sp{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:6px; max-width:150px; padding:3px 9px; cursor:pointer;
  border:2px solid var(--ink); border-radius:99px; background:linear-gradient(180deg,var(--paper),var(--c2xl));
  font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:.04em; color:var(--ink); text-shadow:none;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
.chip img{width:16px;height:16px;border-radius:50%;border:1px solid var(--ink)}
.chip.sq{padding:3px 8px;font-size:13px;font-family:inherit}
.chip:active{transform:translateY(1px)}

.disc{
  position:relative; width:200px; height:200px; flex:none; border-radius:50%; overflow:hidden; cursor:pointer; background:#111;
  border:3px solid var(--ink); box-shadow:0 0 0 4px var(--paper), 0 0 0 6px var(--c2);
}
#ytwrap{position:absolute;left:50%;top:0;width:356px;height:200px;margin-left:-178px;pointer-events:none}
#ytwrap iframe{width:356px;height:200px;border:0}
.idle{
  position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-size:64px;color:#fff;
  background:conic-gradient(from 20deg,var(--c1l),var(--c2l),var(--c3),#ffe28a,var(--c1l)); text-shadow:0 2px 0 rgba(0,0,0,.2);
}
.idle.hide{display:none}
.disc::after{
  content:'';position:absolute;inset:0;z-index:3;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(rgba(255,255,255,0) 0deg,rgba(255,255,255,.38) 40deg,rgba(255,255,255,0) 90deg,color-mix(in srgb,var(--c1) 28%,transparent) 180deg,rgba(255,255,255,0) 230deg,rgba(255,255,255,.38) 300deg,rgba(255,255,255,0) 360deg);
  animation:spin 6s linear infinite; animation-play-state:paused;
}
.disc.playing::after{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.hole{
  position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:4;border-radius:50%;pointer-events:none;

.timeline span{min-width:30px;text-align:center}
input[type=range]{

.cb{

  background:linear-gradient(180deg,var(--paper),var(--c2m) 55%,var(--c2d)); box-shadow:0 2px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.9);

.row.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 35%,transparent),color-mix(in srgb,var(--c3) 35%,transparent));border-color:var(--ink)}
.th{width:38px;height:38px;border-radius:6px;object-fit:cover;border:1.5px solid var(--ink);background:var(--c2xl);flex:none;display:grid;place-items:center;font-size:16px}
.meta{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{font-size:11px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:none;cursor:pointer;font-size:15px;opacity:.45;padding:2px 6px;border-radius:6px;white-space:nowrap}
.row:hover .x{opacity:1}
.x.arm{opacity:1;background:var(--c1);color:var(--onc1);font-size:11px;font-weight:700}
.btn{
  padding:5px 12px;border:2px solid var(--ink);border-radius:99px;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;
  background:linear-gradient(180deg,var(--paper),var(--c2xl));box-shadow:0 2px 0 var(--ink);
}

.form{display:flex;gap:6px;margin-bottom:8px}

.sec{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.08em;margin:12px 0 6px;opacity:.7}

.hint{font-size:11.5px;opacity:.75;line-height:1.5;margin:6px 0}
.code{display:block;padding:6px 8px;border:2px dashed var(--c2);border-radius:8px;background:var(--c2xl);word-break:break-all;margin:4px 0 10px;font-size:12px;user-select:all}
.lbl{display:block;font-weight:700;margin:2px 0 6px}
/* 시트 */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(42,39,80,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:460px;max-height:86%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;
}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:2px solid var(--ink);background:linear-gradient(90deg,var(--c1l),var(--c2l) 55%,var(--c3));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.sh-head .x{color:#fff;opacity:1;font-size:18px}
.sh-body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:6px}
#toast{
  position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);z-index:99;opacity:0;pointer-events:none;max-width:90%;
  background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:99px;font-size:12px;text-align:center;transition:.25s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;animation:spin 1s linear infinite}
body.transp{background:transparent}
.ctrl-note{font-size:11px;opacity:.7}
.sw{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}.sw i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.crow input[type=color]{width:46px;height:30px;padding:0;border:2px solid var(--ink);border-radius:8px;background:var(--paper);cursor:pointer}
.pre{display:flex;flex-wrap:wrap;gap:6px}
</style>

<body>
<div class="shell">
  <header class="titlebar">

<script>
(() => {
'use strict';

/* ───────── 설정 ───────── */
const API = 'https://www.googleapis.com/youtube/v3/';
const SCOPE = 'https://www.googleapis.com/auth/youtube';
// 위젯 안의 ⚙ 설정에서 입력해도 되고, 여기에 직접 넣어도 됩니다.
const DEFAULT_CLIENT_ID = '439149759495-ksnrdo8ukdh3c44a5n74gsgrcn10ermf.apps.googleusercontent.com';

/* ───────── 유틸 ───────── */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('ymw_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ymw_' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('ymw_' + k); } catch {} }
};
const $ = s => document.querySelector(s);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(c)); }
  return n;
}
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; };
const cleanChannel = n => (n || '').replace(/ - Topic$/, '');
let toastTm;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('show'), ms);
}
function parseYT(input) {
  input = (input || '').trim(); const out = {};
  if (!input) return out;
  try {
    const u = new URL(input.includes('://') ? input : 'https://' + input);
    if (/(^|\.)youtu\.be$/.test(u.hostname)) out.video = u.pathname.slice(1).split('/')[0];
    const v = u.searchParams.get('v'); if (v) out.video = v;
    const l = u.searchParams.get('list'); if (l) out.list = l;
  } catch {}
  if (!out.video && !out.list) {
    if (/^[\w-]{11}$/.test(input)) out.video = input;
    else if (/^(PL|OLAK5uy_|UU|FL)[\w-]+$/.test(input)) out.list = input;
  }
  return out;
}

/* ───────── 상태 ───────── */
const S = {
  token: null, exp: 0, user: null,
  playlists: [], view: null, tracks: [], order: [], idx: -1, now: null,
  shuffle: LS.get('shuf', false), repeat: LS.get('rep', 0),
  playing: false, ready: false, player: null, pending: null, errStreak: 0, drag: false,
  loading: false, results: [], sheet: null
};

const IC = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg>',
  shuf: '<svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>',
  rep: '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>',
  rep1: '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15" font-size="8" font-weight="700" text-anchor="middle" fill="#fff">1</text></svg>'
};

/* ───────── YouTube API 호출 ───────── */
async function yt(path, { method = 'GET', params = {}, body } = {}) {
  if (!S.token) throw new Error('login');
  const url = new URL(API + path);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url, {
    method,
    headers: { Authorization: 'Bearer ' + S.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { onExpired(); throw new Error('expired'); }
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    const reason = j.error?.errors?.[0]?.reason || '';
    const e = new Error((reason ? reason + ': ' : '') + (j.error?.message || r.status));
    e.reason = reason; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function fetchAll(path, params, cap = 500) {
  const items = []; let pageToken;
  do {
    const j = await yt(path, { params: { ...params, maxResults: 50, ...(pageToken ? { pageToken } : {}) } });
    items.push(...(j.items || [])); pageToken = j.nextPageToken;
  } while (pageToken && items.length < cap);
  return items;
}
function apiErr(e) {
  if (!e || e.message === 'expired' || e.message === 'login') return;
  const m = String(e.message || e);

/* ───────── 로그인 ───────── */
let tokenClient = null;

/* ───────── 데이터 ───────── */

/* ───────── 재생 ───────── */
function buildOrder() {

  if (S.shuffle) {
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    if (S.idx >= 0) { o = o.filter(x => x !== S.idx); o.unshift(S.idx); }

}

  const vars = { controls: 0, disablekb: 1, fs: 0, modestbranding: 1, playsinline: 1, rel: 0, iv_load_policy: 3 };
  if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
  S.player = new YT.Player('yt', {
    width: 356, height: 200, playerVars: vars,
    events: {

}

}

}
function playOne(t) { S.idx = S.tracks.findIndex(x => x.id === t.id); loadVideo(t); markActive(true); }
function onState(e) {
  const st = e.data;
  if (st === 1) { S.playing = true; S.errStreak = 0; syncMeta(); }
  else if (st === 2) S.playing = false;
  else if (st === 0) { S.playing = false; next(true); }
  renderPlay();
}
function onPlayerError(e) {

  if (S.errStreak >= 5) { S.errStreak = 0; toast('재생 오류가 계속돼서 멈췄어요.'); return; }
  toast(`재생할 수 없는 영상이에요 (코드 ${e.data}) — 다음 곡으로 넘어가요`);

}

      let ch = false;
      if (!S.now.title && d.title) { S.now.title = d.title; ch = true; }
      if (!S.now.channel && d.author) { S.now.channel = cleanChannel(d.author); ch = true; }

  } catch {}
}

  const st = S.player.getPlayerState();
  if (st === 1 || st === 3) S.player.pauseVideo(); else S.player.playVideo();
}
function next(auto = false, skip = false) {
  if (!S.tracks.length) return;
  if (auto && !skip && S.repeat === 2 && S.now && S.ready) { S.player.seekTo(0, true); S.player.playVideo(); return; }
  let p = posOf() + 1;
  if (p >= S.order.length) {

  }

}

  let p = posOf() - 1; if (p < 0) p = S.order.length - 1;

}

    } catch (e) { apiErr(e); }

  };
  goU.onclick = doUrl; u.onkeydown = e => { if (e.key === 'Enter') doUrl(); };
  box.replaceChildren(
    el('div', { class: 'sec', text: 'SEARCH' }),
    el('div', { class: 'form' }, q, goS),
    el('div', { id: 'results' }),
    el('div', { class: 'sec', text: 'IMPORT FROM LINK' }),
    el('div', { class: 'form' }, u, goU),
    el('div', { class: 'hint', text: '재생목록 링크를 넣으면 곡 목록을 가져와 바로 들을 수 있고, “내 계정에 저장”으로 내 재생목록에 복사할 수 있어요. 영상 링크는 결과에 떠서 바로 재생/추가할 수 있어요.' }));
  renderResults();
}
function renderAll() { renderAuth(); renderModes(); renderPlay(); renderNow(); renderQueue(); renderLib(); renderAdd(); }

/* ───────── 시트(모달) ───────── */
function openSheet(title, ...content) {
  closeSheet();
  const bg = el('div', { class: 'sheet-bg', onclick: e => { if (e.target === bg) closeSheet(); } },
    el('div', { class: 'sheet' },
      el('div', { class: 'sh-head' }, el('b', { text: title }), el('button', { class: 'x', onclick: closeSheet }, '✕')),
      el('div', { class: 'sh-body' }, ...content)));
  document.body.append(bg); S.sheet = bg; return bg;
}
function closeSheet() { if (S.sheet) { S.sheet.remove(); S.sheet = null; } }
function openCreate(thenAdd) {
  const name = el('input', { class: 'inp', placeholder: '재생목록 이름', maxlength: '100' });
  const priv = el('select', { class: 'inp' },
    el('option', { value: 'private' }, '비공개'), el('option', { value: 'unlisted' }, '일부 공개 (링크 공유)'), el('option', { value: 'public' }, '공개'));
  const go = el('button', { class: 'btn pink', text: '만들기' });
  go.onclick = async () => {
    const t = name.value.trim(); if (!t) return name.focus();
    go.disabled = true;
    try {
      const pl = await createPlaylist(t, priv.value);
      if (thenAdd) await addToPlaylist(pl.id, thenAdd);
      closeSheet(); toast('만들었어요 ✨');
      if (!thenAdd) openPlaylist(pl);
    } catch (e) { apiErr(e); go.disabled = false; }
  };
  name.onkeydown = e => { if (e.key === 'Enter') go.click(); };
  openSheet(thenAdd ? '새 재생목록에 담기' : '새 재생목록', name, priv, go);
  setTimeout(() => name.focus(), 60);
}
function pickPlaylist(t) {
  if (!S.token) return toast('먼저 로그인해주세요');
  if (!t || !t.id) return toast('추가할 곡이 없어요');
  const list = el('div');
  const cur = S.view && !S.view.readonly ? S.view.id : null;
  const sorted = [...S.playlists].sort((a, b) => (b.id === cur) - (a.id === cur));
  sorted.forEach(p => list.append(el('div', {
    class: 'row', onclick: async () => {
      try { await addToPlaylist(p.id, t); closeSheet(); toast(`“${p.title}”에 담았어요`); } catch (e) { apiErr(e); }
    }
  }, el('img', { class: 'th', src: p.thumb || null, alt: '' }), el('div', { class: 'meta' }, el('div', { class: 't', text: p.title }), el('div', { class: 'c', text: (p.count ?? 0) + '곡' })))));
  openSheet('어느 재생목록에 담을까요?',
    el('div', { class: 'c', text: (t.title || '') }),
    list,
    el('button', { class: 'btn pink', onclick: () => openCreate(t) }, '＋ 새 재생목록 만들고 담기'));
}
function openSettings() {
  const inp = el('input', { class: 'inp', placeholder: 'xxxxxxxx.apps.googleusercontent.com', value: clientId() });
  const save = el('button', {
    class: 'btn pink', onclick: () => {
      const v = inp.value.trim();
      if (v && !/\.apps\.googleusercontent\.com$/.test(v)) return toast('클라이언트 ID 형식이 아니에요 (…apps.googleusercontent.com)', 3500);
      LS.set('cid', v); tokenClient = null; initAuth(); closeSheet(); renderAll(); toast('저장했어요');
    }
  }, '저장');
  openSheet('설정',
    el('label', { class: 'lbl', text: 'Google OAuth 클라이언트 ID' }), inp,
    el('div', { class: 'hint', text: 'Google Cloud Console에서 OAuth 클라이언트(웹 애플리케이션)를 만들고, “승인된 JavaScript 원본”에 아래 주소를 등록하세요.' }),
    el('code', { class: 'code', text: location.origin }),
    save,
    S.token ? el('button', { class: 'btn', onclick: logout }, '로그아웃') : null);
}
function openAccount() {
  openSheet('계정',
    el('div', { class: 't', text: S.user?.name || 'ME' }),
    el('div', { class: 'hint', text: '로그인은 약 1시간 동안 유지돼요. 만료되면 다시 로그인하면 되고, 재생 중인 곡은 끊기지 않아요.' }),
    el('button', { class: 'btn', onclick: logout }, '로그아웃'));
}

/* ───────── 테마(색상) ───────── */
const THEME_KEYS = ['c1', 'c2', 'c3', 'ink', 'paper'];
const THEME_DEFAULT = { c1: '#ff6fb5', c2: '#7a6bff', c3: '#8ff0d0', ink: '#2a2750', paper: '#ffffff', tr: false, title: 'MY♪PLAYLIST.exe' };
const PRESETS = {
  '기본': { c1: '#ff6fb5', c2: '#7a6bff', c3: '#8ff0d0', ink: '#2a2750', paper: '#ffffff' },
  '체리': { c1: '#e8445a', c2: '#b3263e', c3: '#ffb199', ink: '#4a1420', paper: '#fffafa' },
  '민트': { c1: '#26c6a2', c2: '#2f8f9d', c3: '#a8f0b8', ink: '#123c3a', paper: '#fbfffd' },
  '라벤더': { c1: '#a07cff', c2: '#6c63e0', c3: '#f5b3ff', ink: '#2b2457', paper: '#fdfbff' },
  '모노': { c1: '#555555', c2: '#222222', c3: '#bbbbbb', ink: '#111111', paper: '#fafafa' },
  '다크': { c1: '#ff6fb5', c2: '#8f7bff', c3: '#5ee6c0', ink: '#f1eeff', paper: '#1f1b33' }
};
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || '');
const lum = hex => { const n = parseInt(hex.slice(1), 16); const f = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }; return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); };
function themeFromURL() {
  const out = {}, q = new URLSearchParams(location.search);
  for (const k of THEME_KEYS) { const v = q.get(k); if (v && isHex('#' + v)) out[k] = '#' + v.toLowerCase(); }
  if (q.get('tr') === '1') out.tr = true;
  if (q.has('title')) out.title = q.get('title').slice(0, 24);
  return out;
}
const URL_THEME = themeFromURL();
const T = { ...THEME_DEFAULT, ...LS.get('theme', {}), ...URL_THEME };
function applyTheme() {
  const r = document.documentElement.style;
  for (const k of THEME_KEYS) if (isHex(T[k])) r.setProperty('--' + k, T[k]);
  r.setProperty('--onc1', lum(T.c1) > .4 ? '#2a2750' : '#ffffff');
  r.colorScheme = lum(T.paper) < .3 ? 'dark' : 'light';
  document.body.classList.toggle('transp', !!T.tr);
  $('#ttl').textContent = T.title || '';
}
function saveTheme() { LS.set('theme', { c1: T.c1, c2: T.c2, c3: T.c3, ink: T.ink, paper: T.paper, tr: T.tr, title: T.title }); }
function shareUrl() {
  const q = new URLSearchParams();
  for (const k of THEME_KEYS) if (T[k] !== THEME_DEFAULT[k]) q.set(k, T[k].slice(1));
  if (T.tr) q.set('tr', '1');
  if (T.title !== THEME_DEFAULT.title) q.set('title', T.title);
  const base = location.href.split('#')[0].split('?')[0], qs = q.toString();
  return qs ? base + '?' + qs : base;
}
function openTheme() {
  const code = el('code', { class: 'code', text: shareUrl() });
  const refresh = () => { code.textContent = shareUrl(); };
  const inputs = {};
  const syncInputs = () => { for (const k of THEME_KEYS) inputs[k].value = T[k]; tr.checked = !!T.tr; ttl.value = T.title; };
  const pre = el('div', { class: 'pre' }, Object.entries(PRESETS).map(([name, c]) =>
    el('button', { class: 'btn', onclick: () => { Object.assign(T, c); saveTheme(); applyTheme(); syncInputs(); refresh(); } },
      el('span', { class: 'sw' }, el('i', { style: 'background:' + c.c1 }), el('i', { style: 'background:' + c.c2 }), el('i', { style: 'background:' + c.c3 })), name)));
  const labels = { c1: '강조색 (재생 버튼·진행바)', c2: '포인트색 (테두리 장식·버튼)', c3: '보조색 (LCD·선택 표시)', ink: '글자·선 색', paper: '배경 색 (카드)' };
  const rows = THEME_KEYS.map(k => {
    inputs[k] = el('input', { type: 'color', value: T[k], oninput: e => { T[k] = e.target.value; saveTheme(); applyTheme(); refresh(); } });
    return el('label', { class: 'crow' }, el('span', { text: labels[k] }), inputs[k]);
  });
  const tr = el('input', { type: 'checkbox', onchange: e => { T.tr = e.target.checked; saveTheme(); applyTheme(); refresh(); } });
  if (T.tr) tr.checked = true;
  const ttl = el('input', { class: 'inp', maxlength: '24', value: T.title, placeholder: '위젯 제목', oninput: e => { T.title = e.target.value; saveTheme(); applyTheme(); refresh(); } });
  const copy = el('button', { class: 'btn mint', text: '링크 복사' });
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(shareUrl()); toast('복사했어요'); }
    catch { const rg = document.createRange(); rg.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast('위 링크를 길게 눌러/드래그해서 복사해주세요', 3500); }
  };
  const reset = el('button', { class: 'btn', text: '기본값으로', onclick: () => { Object.assign(T, THEME_DEFAULT); saveTheme(); applyTheme(); syncInputs(); refresh(); } });
  openSheet('디자인 설정',
    el('div', { class: 'sec', text: 'PRESET' }), pre,
    el('div', { class: 'sec', text: 'COLORS' }), ...rows,
    el('label', { class: 'crow' }, el('span', { text: '배경 투명 (노션 배경색 그대로)' }), tr),
    el('div', { class: 'sec', text: 'TITLE' }), ttl,
    el('div', { class: 'sec', text: 'NOTION LINK' }),
    el('div', { class: 'hint', text: '지금 고른 색이 들어간 링크예요. 노션에서 임베드 링크를 이 주소로 바꾸면 노션 페이지에서도 같은 색으로 보여요.' + (Object.keys(URL_THEME).length ? ' (현재 접속 링크에 색 설정이 들어 있어서 새로고침하면 그 링크의 색이 우선해요.)' : '') }),
    code, el('div', { class: 'bar' }, copy, reset));
}

/* ───────── 이벤트 ───────── */
$('#authBtn').onclick = () => (S.token ? openAccount() : login());
$('#gearBtn').onclick = openSettings;
$('#themeBtn').onclick = openTheme;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#disc').onclick = togglePlay;
$('#bPlay').onclick = togglePlay;
$('#bNext').onclick = () => next(false);
$('#bPrev').onclick = prev;
$('#bShuf').onclick = () => { S.shuffle = !S.shuffle; LS.set('shuf', S.shuffle); buildOrder(); renderModes(); };
$('#bRep').onclick = () => { S.repeat = (S.repeat + 1) % 3; LS.set('rep', S.repeat); renderModes(); };
$('#bAdd').onclick = () => (S.now ? pickPlaylist(S.now) : toast('재생 중인 곡이 없어요'));
const vol = $('#vol');
const paintRange = r => r.style.setProperty('--p', (Number(r.value) - Number(r.min)) / (Number(r.max) - Number(r.min)) * 100 + '%');
vol.value = LS.get('vol', 70); paintRange(vol);
vol.oninput = () => { paintRange(vol); LS.set('vol', Number(vol.value)); if (S.ready) S.player.setVolume(Number(vol.value)); };
const seek = $('#seek');
seek.oninput = () => { S.drag = true; paintRange(seek); if (S.ready) $('#cur').textContent = fmt(S.player.getDuration() * seek.value / 1000); };
seek.onchange = () => { if (S.ready && S.now) S.player.seekTo(S.player.getDuration() * seek.value / 1000, true); S.drag = false; };
document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
});
setInterval(() => {
  if (!S.ready || !S.now || S.drag) return;
  try {
    const d = S.player.getDuration(), c = S.player.getCurrentTime();
    $('#cur').textContent = fmt(c); $('#dur').textContent = fmt(d);
    seek.value = d > 0 ? Math.round(c / d * 1000) : 0; paintRange(seek);
  } catch {}
}, 300);

/* ───────── 시작 ───────── */
applyTheme(); renderAll(); initMediaKeys(); paintRange(seek);
createPlayer(); initAuth();
const saved = LS.get('tok');
if (saved && saved.exp > Date.now()) { S.token = saved.t; S.exp = saved.exp; S.user = LS.get('user'); afterLogin(); }
else LS.del('tok');
})();
</script>
